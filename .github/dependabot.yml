# Aggiornamenti automatici delle dipendenze.
# Le PR di Dependabot eseguono gli stessi test e lo smoke test del container
# di ogni altra pull request (tests.yml).
version: 2
updates:
  # pyproject.toml (dipendenze e extra dev)
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python-minor-patch:
        update-types: [minor, patch]

  # Librerie front-end (Bootstrap, Bootstrap Icons, Chart.js): package.json e
  # package-lock.json. I file in src/termopilota/static/vendor/ si rigenerano da soli in CI e
  # nella build dell'immagine, quindi la PR di Dependabot si prova da sola.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      frontend:
        patterns: ["*"]

  # Immagini base del Dockerfile (node:22-slim, python:3.14-slim)
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

  # Versioni delle action nei workflow
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
