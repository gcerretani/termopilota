name: Test

# Eseguito su ogni pull request e richiamato da docker.yml prima di pubblicare
# l'immagine (workflow_call): un push su main non produce un'immagine se i
# test falliscono. Non c'e' un trigger push qui per non eseguire i test due volte.
on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Dipendenze Python
        run: pip install -e ".[dev]"

      - name: Node 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Librerie front-end (static/vendor)
        run: |
          npm ci --ignore-scripts
          npm run vendor

      - name: Sintassi di tutti i moduli
        run: python -m compileall -q src scripts tests

      - name: Test
        run: python -m pytest tests/ -v --tb=short

  container:
    name: build e avvio del container
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build dell'immagine (senza push)
        run: docker build -t termopilota:ci .

      - name: Avvio del container
        run: |
          docker run -d --name termopilota-ci -p 5001:5001 \
            -e ADMIN_USER=admin -e ADMIN_PASSWORD=password-ci-solo-test \
            -e SECRET_KEY=chiave-ci-solo-test \
            termopilota:ci

      - name: Smoke test
        run: |
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://localhost:5001/login; then ok=1; break; fi
            sleep 1
          done
          if [ -z "$ok" ]; then
            echo "Il container non risponde su /login"
            docker logs termopilota-ci
            exit 1
          fi
          curl -fsS -o /dev/null http://localhost:5001/sw.js
          curl -fsS -o /dev/null http://localhost:5001/static/manifest.webmanifest
          curl -fsS -o /dev/null http://localhost:5001/static/vendor/chartjs/chart.umd.min.js
          # Le pagine protette devono rimandare al login, non andare in errore 500
          codice=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5001/)
          [ "$codice" = "302" ] || { echo "atteso 302 su /, ottenuto $codice"; docker logs termopilota-ci; exit 1; }

      - name: Log del container in caso di errore
        if: failure()
        run: docker logs termopilota-ci || true
